name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # pub.dev trusts every tag that matches the pattern, so a tag pushed from
      # an unmerged branch would publish code that skipped the pull request and
      # its checks. Release from the merge commit on master.
      - name: Require the tag to sit on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME is not on master; tag the merge commit." >&2
            exit 1
          fi

      # The tag, pubspec.yaml and the MCP registry manifest must name one
      # version, or pub.dev and the registry would each carry a different one.
      # The MCP handshake string is checked by a unit test. The skill keeps its
      # own version, independent of the package (REPO_SPEC section 3).
      - name: Check version stamps
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pubspec="$(awk '/^version:/ { print $2 }' pubspec.yaml)"
          manifest="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' server.json | head -n 1)"
          if [ "$TAG" != "$pubspec" ] || [ "$TAG" != "$manifest" ]; then
            echo "::error::Version mismatch: tag $TAG, pubspec.yaml $pubspec, server.json $manifest." >&2
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ bin/

      - name: Analyze code
        run: dart analyze lib/ test/ bin/

      - name: Run tests
        run: dart test --exclude-tags=integration --timeout=30s

      - name: Validate publish archive
        run: dart pub publish --dry-run

      # pub.dev scores 160 points and a release that loses any of them stops
      # here, before the irreversible publish. A repository URL that does not
      # match the default branch's pubspec.yaml costs the 10 points of "valid
      # pubspec"; an unreachable homepage only warns.
      - name: Require full pub.dev points (pana)
        run: |
          dart pub global activate pana 0.23.13
          dart pub global run pana --no-warning --exit-code-threshold 0 .

      # Runs before the irreversible publish: a tag without a `## [<version>]`
      # section in CHANGELOG.md stops here instead of shipping a version with
      # no GitHub Release.
      - name: Extract changelog section
        id: notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          notes="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG.md section found for $VERSION; refusing to publish a version without release notes." >&2
            exit 1
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s\n' "$notes"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

  github-release:
    name: GitHub Release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub Release
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          NOTES: ${{ needs.validate.outputs.notes }}
        run: |
          case "$VERSION" in
            *-*) FLAG="--prerelease" ;;
            *) FLAG="--latest" ;;
          esac
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES" \
            --verify-tag \
            "$FLAG"

  # Mirrors skills/dowel/ into the skill registry (anilcancakir/ai) after a
  # stable release. Pre-releases are not mirrored. It runs only after the GitHub
  # Release job, so the registry never gets a skill whose release failed.
  registry:
    name: Sync skill to registry
    needs: github-release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/dispatch-to-registry.yml
    secrets:
      REGISTRY_BOT_CLIENT_ID: ${{ secrets.REGISTRY_BOT_CLIENT_ID }}
      REGISTRY_BOT_PRIVATE_KEY: ${{ secrets.REGISTRY_BOT_PRIVATE_KEY }}

  # Publishes server.json to the MCP registry (io.github.anilcancakir/dowel)
  # after a stable release, over the registry's GitHub OIDC login. It runs only
  # after the GitHub Release job, so a failure here leaves pub.dev and the
  # release untouched. The registry holds each version once, so re-running this
  # job after it succeeded fails with "already exists".
  mcp-registry:
    name: Publish to MCP registry
    needs: github-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for the registry's GitHub OIDC login
    env:
      # Pinned on purpose: the registry's own guide warns against the mutable
      # releases/latest URL. Raise it by hand, after checking that the release
      # carries the .sigstore.json bundle for linux_amd64.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in to the registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
