name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The example app depends on the Flutter SDK, so the workspace only
      # resolves with Flutter installed even though the package is pure Dart.
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The example's generated barrel (lib/app/_plugins.g.dart) is written by
      # the plugin refresh command, not formatted by hand, so the gate covers
      # the package and its tests only.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ bin/

      - name: Analyze code
        run: dart analyze lib/ test/ bin/

      - name: Run tests with coverage
        run: dart test --coverage=coverage --exclude-tags=integration --timeout=30s

      - name: Install coverage tool
        run: dart pub global activate coverage

      - name: Format coverage as LCOV
        run: dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --packages=.dart_tool/package_config.json --report-on=lib

      - name: Enforce 80% line coverage floor
        run: |
          lcov_path="coverage/lcov.info"
          if [ ! -f "$lcov_path" ]; then
            echo "lcov.info missing at $lcov_path"
            exit 1
          fi
          pct=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{ if (lf==0) exit 1; printf "%.2f", (lh/lf)*100 }' "$lcov_path")
          echo "Line coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN{ if (p+0 < 80.0) { print "FAIL: coverage below 80% floor"; exit 1 } else { print "PASS: coverage at or above 80% floor" } }'

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Validate publish archive
        run: dart pub publish --dry-run
