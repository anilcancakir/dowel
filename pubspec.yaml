name: dowel
description: "One binary for your Flutter dev loop and your AI agent: start, hot reload and inspect a running app, scaffold code, install plugins transactionally. MCP server included."
version: 0.0.21
homepage: https://anilcancakir.com/dowel
repository: https://github.com/anilcancakir/dowel
issue_tracker: https://github.com/anilcancakir/dowel/issues

# pub.dev search topics (max 5, lowercase + hyphens, regex ^[a-z][a-z0-9-]{0,31}$).
# These drive tag-based discovery on https://pub.dev/packages?q=topic%3A<topic>.
topics:
  - cli
  - mcp
  - ai-agents
  - scaffolding
  - plugin-system

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  args: ^2.7.0
  crypto: ^3.0.0
  dart_mcp: ^0.5.1
  meta: ^1.16.0
  path: ^1.9.0
  stream_channel: ^2.1.0
  vm_service: ^15.2.0
  xml: ">=6.5.0 <8.0.0"
  yaml: ^3.1.3
  yaml_edit: ^2.2.3

dev_dependencies:
  coverage: ^1.9.0
  lints: ^6.0.0
  test: ^1.25.0

executables:
  dowel: dowel
  mcp: mcp
